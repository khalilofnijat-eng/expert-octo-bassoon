[project]
name = "avito-assistant"
version = "0.1.0"
description = "Avito customer assistant for an auto-parts seller (draft mode by default)."
readme = "app/README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    # Avito gateway HTTP client (app/avito_gateway).
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
# Application, not a library: nothing is built or installed as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "tasks", "sessions", "knowledge", "operations", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 flag Cyrillic look-alike letters; this project handles Russian text on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette's TestClient prefers the newer "httpx2" package; plain httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
